plugins {
    id 'base'
    id 'com.gradleup.shadow' version '9.4.3'
}

version = mod_version
group = mod_group_id

// Shared config for every subproject so version/toolchain/repository
// declarations aren't duplicated four times.
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    group = mod_group_id
    version = mod_version

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven { url = 'https://maven.latvian.dev/releases' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def coreProject = project(':marie-core')
def resourcesProject = project(':marie-resources')
def commandsProject = project(':marie-commands')
def uiProject = project(':marie-ui')

// Aggregate the compiled output of all four subprojects into one jar.
// marie-core's jar manifest is reused as the base since it carries the
// NeoForge mod metadata (neoforge.mods.toml).
tasks.register('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'shadow'
    description = 'Merges marie-core, marie-resources, marie-commands and marie-ui into one jar.'

    dependsOn coreProject.tasks.named('classes')
    dependsOn resourcesProject.tasks.named('classes')
    dependsOn commandsProject.tasks.named('classes')
    dependsOn uiProject.tasks.named('classes')
    dependsOn coreProject.tasks.named('jar')

    archiveBaseName.set('maries-framework')
    archiveVersion.set("${mod_version}")
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))

    from coreProject.sourceSets.main.output
    from resourcesProject.sourceSets.main.output
    from commandsProject.sourceSets.main.output
    from uiProject.sourceSets.main.output

    manifest {
        from coreProject.tasks.named('jar').get().manifest
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
